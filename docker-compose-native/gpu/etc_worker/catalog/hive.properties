# Select the connector implementation. "hive-hadoop2" uses the Hive connector
# backed by Hadoop 2.x libraries which is the default for Presto's Hive support.
connector.name=hive-hadoop2

# Parquet read options
# chunk-read-limit MUST be 0: non-zero triggers cuDF chunking bug where string
# column size estimation is overly conservative (15 chunks for 33MB output).
parquet.reader.chunk-read-limit=536870912

# Limit (in bytes) on the amount of memory used for reading and decompressing data or 0 if there is no limit
parquet.reader.pass-read-limit=2147483648

hive.pushdown-filter-enabled=true
hive.parquet.pushdown-filter-enabled=true

cudf.hive.use-buffered-input=true
cudf.hive.use-experimental-reader=true
