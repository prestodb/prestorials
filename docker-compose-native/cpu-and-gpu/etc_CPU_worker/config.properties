# This node is a worker: it executes tasks but doesn't coordinate queries.
coordinator=false
http-server.http.port=8082

# Register with the coordinator; "coordinator" resolves via Docker service DNS.
discovery.uri=http://coordinator:8080

# Report one version string so coordinator and worker builds can join the same cluster.
presto.version=latest

# Memory budget: just under the 80G container limit in the compose file.
system-memory-gb=72
query-memory-gb=70
query.max-memory-per-node=70GB
memory-arbitrator-kind=SHARED
shared-arbitrator.reserved-capacity=4GB

task.max-drivers-per-task=10
async-data-cache-enabled=true
