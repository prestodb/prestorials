# This node is the coordinator: it plans queries and hands work to the workers.
coordinator=true
node-scheduler.include-coordinator=false
http-server.http.port=8080

# Workers find the coordinator here; "coordinator" resolves via Docker service DNS.
discovery-server.enabled=true
discovery.uri=http://coordinator:8080

# Report one version string so coordinator and worker builds can join the same cluster.
presto.version=latest

query.max-memory=70GB

# Required settings for Presto C++ (Velox) workers:
# https://prestodb.io/docs/current/presto_cpp/properties.html
native-execution-enabled=true
optimizer.optimize-hash-generation=false
regex-library=RE2J
use-alternative-function-signatures=true

single-node-execution-enabled=true
