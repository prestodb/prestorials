connector.name=hive-hadoop2

# Simple file-based metastore: table metadata is JSON under /home/metastore (the ./metastore mount).
hive.metastore=file
hive.metastore.catalog.dir=file:/home/metastore

hive.allow-drop-table=true
# Allow INSERT into external tables.
hive.non-managed-table-writes-enabled=true
# Write data files straight into the shared warehouse instead of a node-local staging dir.
hive.temporary-staging-directory-enabled=false

# Split large Parquet files at row-group boundaries so scans parallelize.
hive.file-splittable=true
hive.pushdown-filter-enabled=true
hive.parquet.pushdown-filter-enabled=true
